; ClipBucket recommended PHP settings (see docs/requirements.html)
; Uploads are effectively unlimited (ClipBucket also enforces its own
; max_upload_size / max_photo_size config values, raised by the installer).
upload_max_filesize = 20480M
post_max_size = 22528M
max_execution_time = 1000
max_input_time = 1000
memory_limit = 512M
session.gc_maxlifetime = 14000
output_buffering = 4096
date.timezone = UTC
